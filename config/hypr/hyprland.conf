################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,preferred,auto,1.25

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = footclient
$browser = brave-bin --disable-gpu
$menu = ./.config/rofi/launchers/type-2/launcher.sh


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = swaybg -i /home/alex/.config/bg/bg.png
exec-once = "/home/alex/.scripts/sound.sh"
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dunst
exec-once = hyprctl setcursor 'Bibata-Modern-Classic' 22
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = foot --server
exec-once = sway-audio-idle-inhibit
#exec-once = /home/alex/.scripts/battery_saver.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,22
env = HYPRCURSOR_SIZE,22
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland
#env = WLR_RENDERER, vulkan


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = 0xff8072b3
    col.inactive_border = 0xff585D8C
    no_border_on_floating=true


    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    #allow_tearing = true

    layout = master
}

cursor{
        inactive_timeout = 2
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.85

    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 2
    shadow_offset = 2 2
    col.shadow = rgba(1E202966)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = on
        vibrancy = 0.1696
        ignore_opacity=on
        xray=true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more

#############
### INPUT ###
#############

$mainMod = ALT # Sets "Alt" key as main modifier

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,gr
    kb_variant = 
    kb_model =
    kb_options = grp:toggle,caps:escape
    kb_rules =
    repeat_delay = 300
    repeat_rate = 50

    mouse_refocus = 0
    scroll_factor=0.6
    follow_mouse = 1
    sensitivity = -0.9# -1.0 - 1.0, 0 means no modification.
    accel_profile=adaptive
}

device{
        name = dell0b6b:00-04f3:31e2-mouse
        natural_scroll = true
        sensitivity=+0.1
        accel_profile=flat
}

device{
        name = dell0b6b:00-04f3:31e2-touchpad
        natural_scroll = true
        sensitivity=+0.1
        accel_profile=flat
}

misc{
        enable_swallow = true
        swallow_regex = ^(brave-bin|zathura|gnome-tweaks|footclient)$
        disable_hyprland_logo =true
        new_window_takes_over_fullscreen=2
        vfr=true
        mouse_move_enables_dpms=true
        key_press_enables_dpms=true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more

####################
### KEYBINDINGSS ###
####################

bind = $mainMod, Return, layoutmsg, swapwithmaster
bind = $mainMod, H, resizeactive, -50 0
bind = $mainMod, L, resizeactive, 50 0
bind = $mainMod, F, fullscreen
bind = $mainMod, j, layoutmsg, cyclenext
bind = $mainMod, k, layoutmsg, cycleprev
bind = $mainMod Shift, Return, exec, $terminal
bind = $mainMod Shift, C, killactive,
bind = $mainMod Shift, Q, exec, "/home/alex/.config/rofi/powermenu.sh"
#bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, $browser
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -theme .config/rofi/launchers/type-2/style-1.rasi | cliphist decode | wl-copy
bind = $mainMod, C, exec, "/home/alex/.scripts/color_picker.sh"

# binds to control volume
bind = , code:95, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , code:76, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , code:75, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# binds to control brightness
bind = , code:71, exec, light -A 5
bind = , code:70, exec, light -U 5

# binds for player controls
bind = , code:73 , exec, playerctl play-pause
bind = , code:74 , exec, playerctl next
bind = , code:72 , exec, playerctl prev

# binds for screenshots

bind = $mainMod, A, exec, /home/alex/.scripts/screenshot.sh window
bind = $mainMod, S, exec, /home/alex/.scripts/screenshot.sh full
bind = $mainMod, D, exec, /home/alex/.scripts/screenshot.sh region

# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
# bind = $mainMod, left, movefocus, l
# bind = $mainMod, right, movefocus, r
# bind = $mainMod, up, movefocus, u
# bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

